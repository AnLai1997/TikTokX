name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        scheme: [rootful, rootless]
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ldid make dpkg xz

      - name: Setup Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          git clone --depth 1 https://github.com/theos/sdks.git sdks-tmp
          mv sdks-tmp/*.sdk "$THEOS/sdks/"
          rm -rf sdks-tmp

      - name: Build package
        run: |
          if [ "${{ matrix.scheme }}" = "rootless" ]; then
            gmake package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          else
            gmake package FINALPACKAGE=1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: TikTokX-${{ matrix.scheme }}
          path: packages/*.deb
